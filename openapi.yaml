openapi: "3.1.0"
info:
  title: RunFood API
  version: 1.0.0
  description: |
    API REST para integrar tu aplicación con un punto de venta RunFood.
    Te permite crear y consultar pedidos, leer el catálogo de productos y métodos de pago, y recibir eventos en tiempo real vía webhooks.

    ---

    # Empieza en 5 minutos

    Antes de pedir credenciales de producción, prueba todo contra nuestro **ambiente público de demo**. No hace falta pedir permiso ni pagar nada — toma la API key de abajo y empieza.

    ## Ambiente de demo

    **URL base:**
    ```
    https://ec-s2.runfoodapp.com/apps/demo/api/v1
    ```

    **API Key (compartida, solo para pruebas):**
    ```
    184bc6459fe440e1318852fb074f1d7f3c5036a049d5245beea810e13227a503
    ```

    Cuando autentiques con esta key y llames a `GET /apps/me`, vas a ver esta identidad:

    | Campo | Valor |
    |---|---|
    | `id` | `fantastic_app` |
    | `name` | `Fantastic App` |
    | `icon_url` | `https://runfoodapp.com/fantastic_app.png` |
    | `scopes` | *(todos)* |

    > Es una cuenta compartida entre todos los que están probando. Los datos del demo los puede modificar cualquiera — no guardes nada crítico ahí.

    ## Prueba rápida con curl

    Verifica que estás conectado y que tu key funciona:

    ```bash
    # 1. Health check (no necesita auth)
    curl https://ec-s2.runfoodapp.com/apps/demo/api/v1/health

    # 2. Tu identidad como app (requiere X-Api-Key)
    curl -H "X-Api-Key: 184bc6459fe440e1318852fb074f1d7f3c5036a049d5245beea810e13227a503" \
         https://ec-s2.runfoodapp.com/apps/demo/api/v1/apps/me
    ```

    Si los dos responden 200, ya estás listo para explorar los demás endpoints.

    ---

    # Autenticación

    Todos los endpoints (excepto los marcados como **Public**) necesitan un solo header:

    ```
    X-Api-Key: <tu_api_key>
    ```

    Cada endpoint está protegido por un **scope** (permiso):
    `orders:read`, `orders:write`, `products:read`, `payment-methods:read`, `apps:read`.

    Tu API key tiene asignados los scopes que hayas solicitado al momento de generarla. Si llamas a un endpoint sin el scope correspondiente, recibes un `403 insufficient_scope`.

    ---

    # Pasar a producción

    El demo sirve para desarrollar, pero cuando quieras conectarte con un cliente real necesitas credenciales nuevas, específicas para ese local.

    ## Antes de solicitar acceso

    El cliente (el restaurante o local que usa RunFood) tiene que ser alcanzable desde internet. Hay dos caminos:

    1. **El cliente pone su propia infraestructura.** IP pública fija más un certificado HTTPS válido instalado en su servidor RunFood. Es lo ideal si ya tiene equipo técnico.
    2. **Nosotros le damos un túnel gestionado.** Le asignamos un subdominio tipo `mi-restaurante.runfoodapp.com` y nos encargamos del HTTPS y de exponer el servicio. Útil cuando el cliente no quiere lidiar con redes.

    Además, necesitas tener claros los datos de tu app antes de enviar la solicitud:

    | Campo | Descripción |
    |---|---|
    | `id` | Identificador único (ej. `fantastic_app`). Debe ser único en todo RunFood: no se puede repetir en ningún otro cliente. Piénsalo como un handle global. |
    | `name` | Nombre que se va a mostrar al usuario dentro del POS (ej. *Fantastic App*). |
    | `icon_url` | URL pública de tu ícono. PNG cuadrado, mínimo 128x128. |
    | `scopes` | Los permisos que tu app necesita (lista separada por comas). Pide solo los que vas a usar. |

    ## Cómo solicitarla

    Todo se tramita por correo a **soporte@runfoodapp.com**. Lo más limpio es que el **dueño del local** sea quien envíe la solicitud desde su correo, porque así queda autorizada al instante.

    Si prefieres encargarte tú como integrador, puedes hacerlo — pero entonces el dueño tiene que mandarnos por separado una autorización corta desde su correo (abajo hay una plantilla para cada caso).

    El correo de solicitud debe incluir:

    - **Del cliente:** RUC, razón social, ciudad y sector
    - **Del servidor del cliente:** IP pública o URL del túnel, más el puerto
    - **De tu app:** los 4 campos de la tabla anterior (`id`, `name`, `icon_url`, `scopes`)

    ### Plantilla — solicitud enviada por el dueño del local

    Copia este texto, reemplaza los `[corchetes]` y envíalo desde el correo del dueño:

    ```text
    Asunto: Solicitud de credenciales API — [RUC] — [Nombre de la app]

    Hola equipo de RunFood,

    Autorizo la creación de credenciales de API de terceros para mi
    establecimiento con los siguientes datos:

    DATOS DEL ESTABLECIMIENTO
    - Razón social: [Razón social]
    - RUC: [RUC]
    - Ciudad / sector: [Ciudad, sector]
    - IP pública o URL del túnel: [ej. 181.xxx.xxx.xxx:3200]

    APLICACIÓN A CONECTAR
    - Nombre visible: [Nombre de la app]
    - ID (identificador único): [identificador_app]
    - URL del ícono: https://...
    - Permisos solicitados: [ej. orders:read, orders:write, products:read]

    Confirmo haber leído los costos de activación vigentes y estoy de acuerdo.

    Saludos,
    [Nombre del dueño]
    [Correo]
    [Teléfono]
    ```

    ### Plantilla — autorización corta del dueño (cuando el integrador hace la solicitud)

    Si la solicitud técnica la envía el integrador, necesitamos que el **dueño** nos mande por separado este correo desde su cuenta. Sin él no podemos avanzar.

    ```text
    Asunto: Autorización de integración API — [RUC]

    Hola equipo de RunFood,

    Autorizo a [Nombre del integrador], correo [correo@integrador.com],
    a solicitar y gestionar credenciales de API de terceros en mi cuenta
    de RunFood.

    RUC: [RUC]
    Razón social: [Razón social]
    Ciudad / sector: [Ciudad, sector]

    Saludos,
    [Nombre del dueño]
    ```

    ## Costos

    | Concepto | Costo | Modalidad |
    |---|---|---|
    | **Generación de API Key** | **USD 50** | Pago único, de por vida, por cada credencial que se genere en un cliente |
    | **Túnel gestionado — activación** | **USD 30** | Pago único al activar el subdominio |
    | **Túnel gestionado — mantenimiento** | **USD 10 / mes** | Recurrente, a partir del segundo mes |

    > El túnel es **opcional**. Si el cliente ya tiene su propia IP pública con HTTPS, no lo necesitas y no pagas nada por ese concepto.

    ---

    # Consideraciones importantes antes de integrar

    **RunFood es on-premise.** Esto es clave y tiene que entenderlo bien antes de escribir código: el servidor no vive en la nube, vive físicamente dentro del local del cliente. Está así a propósito — así la caja, el monitor de cocina y las impresoras funcionan a velocidad de red local aunque se vaya el internet.

    La consecuencia para ti como integrador es que **el servidor del cliente no siempre va a estar disponible**, y eso no es un error: es parte del día a día. Se va la luz, reinician el router, cambia la IP, el ISP del local tiene problemas. Tu integración tiene que asumir esto como un estado normal, no como una excepción.

    ## Cómo preparar tu integración

    Estas son las estrategias que recomendamos a los equipos que ya llevan tiempo integrados con RunFood. No son opcionales si quieres que tu producto sea estable en producción.

    ### 1. Cola de reintentos con backoff exponencial

    Cuando una request falla por timeout o devuelve 5xx, no la pierdas: guárdala en una cola local en tu lado y reinténtala con delays crecientes (por ejemplo 1s, 5s, 30s, 5min, 30min). Después de 24 horas sin éxito, escala el incidente y avisa al equipo que corresponde.

    ### 2. Idempotencia con `external_id`

    `POST /orders` acepta un campo `external_id` que debe ser único en tu sistema. Si reenvías un pedido con el mismo `external_id`, la API te devuelve `409` con el `id` del pedido que ya existía, en lugar de crear uno duplicado.

    **Úsalo siempre.** Es tu seguro contra envíos duplicados cuando la red te juegue sucio — sin él, un reintento puede cobrarle dos veces al cliente final.

    ### 3. Webhooks en vez de polling

    En lugar de preguntarle cada 10 segundos al servidor "¿pasó algo nuevo?", suscríbete a los webhooks que te interesan (`ORDER.CREATED`, `ORDER.CLOSED`, `INVOICE.CREATED`, etc.). RunFood te empuja el cambio cuando ocurre.

    Esto reduce la carga en el servidor del cliente y tu latencia de reacción. El polling constante, en un ambiente on-premise con ancho de banda limitado, es una mala idea.

    ### 4. Valida la firma HMAC en cada webhook que recibas

    Cada webhook viene con un header `X-Signature-256`. Antes de procesar el payload, calcula `HMAC_SHA256(secret, raw_body)` y compáralo con lo que viene en ese header. Si no coinciden, descarta el mensaje.

    Esto protege tu endpoint aunque sea público: sin el secret, nadie puede falsificar un payload que tu servicio acepte.

    ### 5. Health check periódico

    Llama a `GET /health` cada 1 a 5 minutos desde tu backend y guarda el resultado. Así armas un histórico de disponibilidad del cliente y detectas caídas antes que tus propios usuarios se quejen.

    ### 6. Reconcilia cuando el cliente vuelva a estar en línea

    Después de una caída, no asumas que todo quedó sincronizado. Corre una pasada de reconciliación:

    - Los pedidos que tú tienes con `external_id` y que no aparecen en RunFood: reenvíalos.
    - Los pedidos que aparecen en RunFood y que tú no tienes indexados (porque perdiste webhooks durante la caída): bájalos y guárdalos.

    Esta rutina es la que hace la diferencia entre una integración que "más o menos funciona" y una que es confiable.

    ---

    # Webhooks salientes

    Además de las peticiones que tú haces a RunFood, RunFood también puede hacer peticiones a **tu** servidor. Cuando pasa algo importante (se crea un pedido, se cierra una factura, se anula una venta), RunFood envía un `POST` HTTP al endpoint que hayas registrado.

    - **Webhooks** — cómo registrar, listar y eliminar tus suscripciones
    - **Webhook Events** — qué formato tiene el payload que vas a recibir

servers:
  - url: https://{client_domain}/api/v1
    description: Demo público (Ecuador)
    variables:
      client_domain:
        default: "ec-s2.runfoodapp.com/apps/public.demo"

tags:
  - name: Public
    description: Endpoints públicos, sin autenticación
  - name: Orders
    description: Crear, consultar, modificar y eliminar pedidos
  - name: Products
    description: Consultar el catálogo de productos del cliente
  - name: Payment Methods
    description: Consultar los métodos de pago configurados
  - name: Apps
    description: Consultar el perfil de la app autenticada
  - name: Webhooks
    description: Registrar, listar y eliminar tus suscripciones a eventos
  - name: Webhook Events
    description: |
      Formato de los payloads que RunFood te envía cuando ocurren eventos internos.
      Esto NO son endpoints que tú llames — son requests HTTP POST que RunFood hace a tu servidor.

#
# Security
#
security:
  - apiKeyAuth: []

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Autenticación por API key en el header `X-Api-Key`. Una sola clave — no hay header adicional.

  schemas:
    # ── Shared ──
    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: not_found
        message:
          type: string
          example: "Product 'XXXX' not found"

    # ── Health ──
    HealthResponse:
      type: object
      required: [status, version, uptime, runtime, checkedAt]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: "17.7.2"
        commitHash:
          type: string
          example: "abc1234"
        buildDate:
          type: string
          example: "2026-03-01T00:00:00.000Z"
        startedAt:
          type: string
          format: date-time
        uptime:
          type: integer
          description: Tiempo activo del servidor, en segundos
          example: 86400
        uptimeHuman:
          type: string
          example: "1d 0h 0m"
        runtime:
          type: object
          required: [name, version]
          properties:
            name:
              type: string
              enum: [bun, node]
            version:
              type: string
        platform:
          type: string
          example: "win32-x64"
        hostname:
          type: string
        checkedAt:
          type: string
          format: date-time
        timeZone:
          type: string
          example: "America/Guayaquil"
        UTC:
          type: string
          example: "UTC-5"

    # ── Identity ──
    IdentityResponse:
      type: object
      required: [ruc, razonSocial, version, fingerprint]
      properties:
        ruc:
          type: string
          example: "0992877878001"
        razonSocial:
          type: string
          example: "RESTAURANTE DEMO S.A."
        nombreComercial:
          type: string
          example: "La Esquina del Sabor"
        establecimiento:
          type: string
          example: "001"
        bodega:
          type: integer
          example: 1
        ciudad:
          type: string
          example: "Guayaquil"
        version:
          type: string
          example: "17.7.2"
        channel:
          type: string
          example: "stable"
        fingerprint:
          type: string
          description: Hash estable derivado de RUC + razón social + bodega. Sirve para identificar al cliente de forma consistente entre reinicios.
          example: "fp-a1b2c3d4"
        capabilities:
          type: array
          items:
            type: string
          example: ["electronic-invoicing", "tables", "kitchen-monitor"]
        requiresApproval:
          type: boolean
          example: false

    # ── Products ──
    Product:
      type: object
      required: [sku, name, price, tax_applicable, active]
      properties:
        sku:
          type: string
          example: "PROD-001"
        name:
          type: string
          example: "Hamburguesa Clásica"
        price:
          type: number
          format: float
          example: 5.99
        tax_applicable:
          type: boolean
          example: true
        active:
          type: boolean
          example: true

    ProductListResponse:
      type: object
      required: [data, count]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        count:
          type: integer
          example: 42

    # ── Orders ──
    CustomerInput:
      type: object
      properties:
        full_name:
          type: string
          example: "Juan Pérez"
        tax_id:
          type: string
          example: "0912345678"
        email:
          type: string
          format: email
        phone:
          type: string

    AddressInput:
      type: object
      properties:
        address:
          type: string
          example: "Av. 9 de Octubre 123"
        reference:
          type: string
          example: "Frente al parque"
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    ItemInput:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          example: "PROD-001"
        quantity:
          type: number
          example: 2
        unit_price:
          type: number
          description: Precio unitario. Si lo omites, usamos el PVP configurado en el producto.
          example: 5.99
        notes:
          type: string
          example: "Sin cebolla"
        metadata:
          type: object
          additionalProperties: true
          description: Datos adicionales (clave-valor) que tú controlas. Útil para guardar referencias de tu propio sistema.

    ItemOutput:
      type: object
      required: [item_id, sku, name, quantity, unit_price, total, tax_applicable]
      properties:
        item_id:
          type: string
          example: "1"
        sku:
          type: string
          example: "PROD-001"
        name:
          type: string
          example: "Hamburguesa Clásica"
        quantity:
          type: number
          example: 2
        unit_price:
          type: number
          example: 5.99
        total:
          type: number
          example: 11.98
        notes:
          type: string
        tax_applicable:
          type: boolean
        course:
          type: string
          description: Sección de cocina a la que pertenece el item (si aplica)

    TabInput:
      type: object
      required: [external_id, name, items]
      properties:
        external_id:
          type: string
          example: "tab-main"
        name:
          type: string
          example: "Mesa Principal"
        reference:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ItemInput"

    TabOutput:
      type: object
      properties:
        external_app:
          type: string
          nullable: true
        external_id:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemOutput"

    OrderInput:
      type: object
      required: [external_id, tabs]
      properties:
        external_id:
          type: string
          description: ID único del pedido dentro de tu sistema. Se usa para idempotencia — si reenvías el mismo pedido, te devolvemos 409 en vez de duplicarlo.
          example: "order-12345"
        reference:
          type: string
          description: Referencia visible para el usuario (ej. el número de pedido que vio el cliente)
          example: "REF-001"
        tabs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TabInput"
        service_type:
          type: string
          description: Tipo de servicio (delivery, pickup, dine-in, etc.)
          example: "delivery"
        table_number:
          type: string
          maxLength: 20
          example: "12"
        customer:
          $ref: "#/components/schemas/CustomerInput"
        delivery_address:
          $ref: "#/components/schemas/AddressInput"

    OrderOutput:
      type: object
      required: [id, status, order_number, total, currency, tabs]
      properties:
        id:
          type: integer
          example: 1042
        external_id:
          type: string
          nullable: true
        external_app:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
        status:
          type: string
          enum: [scheduled, open, closed, merged, cancelled]
          example: "open"
        order_number:
          type: integer
          example: 157
        service_type:
          type: string
        table_number:
          type: string
        total:
          type: number
          example: 13.77
        currency:
          type: string
          example: "USD"
        tabs:
          type: array
          items:
            $ref: "#/components/schemas/TabOutput"
        created_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        guest_count:
          type: integer
          example: 0

    # ── Batch Item Operations ──
    BatchItemOperation:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [add, remove, update]
          description: |
            - `add`: agrega un item al pedido. Necesita `sku` y `quantity`.
            - `remove`: elimina un item del pedido. Necesita `item_id`.
            - `update`: modifica la cantidad o las notas de un item. Necesita `item_id`.
        sku:
          type: string
          description: Requerido cuando `op` es `add`.
        item_id:
          type: integer
          description: Requerido cuando `op` es `remove` o `update`.
        quantity:
          type: number
        unit_price:
          type: number
          description: Solo se acepta cuando `op` es `add`. Una vez creado el item, el precio no se puede cambiar.
        notes:
          type: string
        tab_ref:
          type: string
        metadata:
          type: object
          additionalProperties: true

    BatchItemResult:
      type: object
      properties:
        op:
          type: string
        item_id:
          type: integer
        sku:
          type: string
        status:
          type: string
          enum: [ok, error]
        reason:
          type: string

    PatchItemsResponse:
      type: object
      properties:
        applied:
          type: array
          items:
            $ref: "#/components/schemas/BatchItemResult"
        order_total:
          type: number
          example: 25.50

    # ── Payment Methods ──
    PaymentMethod:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          example: "1"
        code:
          type: string
          example: "EFECTIVO"
        name:
          type: string
          example: "Efectivo"
        metadata:
          type: object
          properties:
            sri_code:
              type: string
              example: "01"

    # ── Apps ──
    AppProfile:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        icon_url:
          type: string
          nullable: true
        scopes:
          type: string
          nullable: true
          description: Lista de scopes separados por coma. Si viene `null`, la app tiene acceso a todos los scopes (compatibilidad con apps antiguas).
          example: "orders:read,orders:write,products:read"
        created_at:
          type: string
          format: date-time
          nullable: true

    # ── Webhooks ──
    WebhookInput:
      type: object
      required: [event, endpoint]
      properties:
        event:
          type: string
          description: Nombre del evento al que quieres suscribirte
          example: "ORDER.CREATED"
        endpoint:
          type: string
          format: uri
          description: URL (idealmente HTTPS) donde RunFood va a enviar los webhooks
          example: "https://miapp.com/webhooks/runfood"

    WebhookOutput:
      type: object
      required: [id, event, endpoint]
      properties:
        id:
          type: integer
          example: 15
        event:
          type: string
          example: "ORDER.CREATED"
        endpoint:
          type: string
          format: uri

    # ── Webhook Payload (outbound) ──
    WebhookPayload:
      type: object
      description: Payload que RunFood envía a tu endpoint vía HTTP POST cuando ocurre un evento.
      required: [event, timestamp, schema_version, data]
      properties:
        event:
          type: string
          description: Nombre del evento
          example: "ORDER.CREATED"
        timestamp:
          type: string
          format: date-time
        schema_version:
          type: string
          example: "2025-02-12"
        data:
          type: object
          description: Contenido del evento. La estructura varía según el tipo de evento (`ORDER.CREATED`, `INVOICE.CREATED`, etc.).
        metadata:
          type: object
          properties:
            usuario:
              type: object
              properties:
                id:
                  type: integer
                nombre:
                  type: string
            dispositivo:
              type: object
              properties:
                id:
                  type: string
                nombre:
                  type: string
            original_url:
              type: string
            api_base_url:
              type: string

#
# Paths
#
paths:
  # ── Public ──
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Retorna el estado del servidor, versión, uptime y metadata del runtime.
      tags: [Public]
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /identity:
    get:
      operationId: getIdentity
      summary: Identidad del servidor
      description: |
        Retorna la información del establecimiento para el flujo de conexión del RunFood Shell.
        Incluye RUC, razón social, capabilities y un fingerprint estable.
      tags: [Public]
      security: []
      responses:
        "200":
          description: Identidad del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"

  # ── Orders ──
  /orders:
    post:
      operationId: createOrder
      summary: Crear pedido
      description: |
        Crea un pedido con una o más cuentas (tabs), cada una con sus items.
        Es idempotente por `external_id`: si ya existe un pedido con ese mismo `external_id`
        para tu app, te devuelve `409` con el `id` del pedido existente en lugar de crear uno nuevo.
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderOutput"
        "400":
          description: Error de validación (campos faltantes o producto no encontrado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Autenticación faltante o inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Pedido duplicado (mismo external_id)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiError"
                  - type: object
                    properties:
                      id:
                        type: integer
                        description: ID del pedido existente
                      status:
                        type: string

  /orders/{id}:
    get:
      operationId: getOrder
      summary: Detalle de un pedido
      description: |
        Retorna un pedido completo con sus tabs e items.
        Solo devuelve pedidos que pertenezcan a tu app — no puedes leer los de otras apps, aunque conozcas el ID.
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1042
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderOutput"
        "404":
          description: Pedido no encontrado o no pertenece a esta app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Autenticación faltante o inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      operationId: deleteOrder
      summary: Eliminar pedido
      description: |
        Elimina un pedido que todavía esté abierto (estado `open`).
        Los pedidos cerrados o cancelados ya no se pueden eliminar — para esos casos tendrías que hacer una anulación desde el POS.
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Motivo de eliminación (opcional, queda registrado en el historial)
                  example: "El cliente canceló el pedido"
      responses:
        "200":
          description: Pedido eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  deleted:
                    type: boolean
                    example: true
        "400":
          description: El pedido no está en estado open (ya fue cerrado o anulado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /orders/{id}/items:
    patch:
      operationId: patchOrderItems
      summary: Modificar items de un pedido
      description: |
        Permite hacer múltiples operaciones (`add`, `remove`, `update`) sobre los items de un pedido abierto, en una sola llamada.

        Cada operación se procesa de forma independiente: si una falla (producto no encontrado, item inexistente, etc.), las demás continúan y te devolvemos el resultado de cada una por separado.
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/BatchItemOperation"
      responses:
        "200":
          description: Resultado detallado de cada operación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchItemsResponse"
        "400":
          description: El pedido no está en estado open, o hay un error de validación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Products ──
  /products:
    get:
      operationId: listProducts
      summary: Listar productos
      description: Retorna todos los productos activos del catálogo. Puedes filtrar por nombre o código usando el parámetro `search`.
      tags: [Products]
      parameters:
        - name: search
          in: query
          required: false
          description: Filtro por nombre o código (no distingue mayúsculas/minúsculas, busca coincidencias parciales)
          schema:
            type: string
            example: "hamburguesa"
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "401":
          description: Autenticación faltante o inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /products/{sku}:
    get:
      operationId: getProductBySku
      summary: Detalle de un producto
      description: Retorna un producto a partir de su SKU (código).
      tags: [Products]
      parameters:
        - name: sku
          in: path
          required: true
          description: Código único del producto
          schema:
            type: string
            example: "PROD-001"
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Autenticación faltante o inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Payment Methods ──
  /payment-methods:
    get:
      operationId: listPaymentMethods
      summary: Listar métodos de pago
      description: Retorna los métodos de pago configurados en el establecimiento (efectivo, tarjetas, transferencias, etc.).
      tags: [Payment Methods]
      responses:
        "200":
          description: Lista de métodos de pago
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentMethod"
        "401":
          description: Autenticación faltante o inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Apps ──
  /apps/me:
    get:
      operationId: getAppProfile
      summary: Perfil de tu app
      description: Retorna el perfil de la app que está autenticando en este momento (id, nombre, ícono, scopes, fecha de creación).
      tags: [Apps]
      responses:
        "200":
          description: Perfil de la app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppProfile"
        "401":
          description: Autenticación faltante o inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Webhooks ──
  /webhooks:
    post:
      operationId: createWebhook
      summary: Registrar webhook
      description: |
        Crea una suscripción para que RunFood te envíe un HTTP POST cuando ocurra un evento.

        **Eventos disponibles:**
        | Evento | Cuándo se dispara |
        |--------|-------------------|
        | `ORDER.CREATED` | Se creó un pedido nuevo |
        | `ORDER.UPDATED` | Se modificó un pedido existente (items, estado) |
        | `ORDER.SAVED` | Atajo: se disparó un CREATED o un UPDATED |
        | `ORDER.CLOSED` | Se cerró/facturó un pedido |
        | `ORDER.REVERSED` | Se anuló un pedido completo |
        | `ORDER.PRODUCT.REVERSED` | Se anuló un item individual dentro de un pedido |
        | `INVOICE.CREATED` | Se generó una factura o venta |

        **Headers que vas a recibir en cada POST:**
        - `Content-Type: application/json`
        - `User-Agent: runfoodcore/{version}`
        - `X-Event-Type: {nombre_del_evento}`
        - `X-Request-ID: {id_único_del_request}`
        - `X-Signature-256: sha256={hmac}` — solo si configuraste un secret al registrar el webhook
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookInput"
      responses:
        "201":
          description: Webhook creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookOutput"
        "400":
          description: Faltan campos requeridos o el endpoint no es una URL válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    get:
      operationId: listWebhooks
      summary: Listar webhooks
      description: Devuelve todas las suscripciones que tu app tiene registradas en este cliente.
      tags: [Webhooks]
      responses:
        "200":
          description: Lista de webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookOutput"

  /webhooks/{id}:
    delete:
      operationId: deleteWebhook
      summary: Eliminar webhook
      description: Elimina una suscripción de webhook. Después de esto, RunFood deja de enviarte POSTs para ese evento.
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Webhook eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
                  deleted_at:
                    type: string
                    format: date-time
        "404":
          description: Webhook no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Webhook Events (outbound documentation) ──
  /webhook-events/order:
    post:
      operationId: webhookEventOrder
      summary: "Webhook: ORDER.CREATED / ORDER.UPDATED / ORDER.CLOSED"
      description: |
        **Esto NO es un endpoint que tú llames.** Es la documentación del payload que RunFood te envía cuando ocurre un evento relacionado con pedidos.

        RunFood hace un `POST` HTTP a la URL que registraste, con el body que ves aquí abajo.

        ### Verificar autenticidad (recomendado)

        Si configuraste un `secret` al registrar el webhook, cada request va a incluir un header `X-Signature-256`. Antes de procesar el payload, valídalo:

        ```
        firma_esperada = "sha256=" + HMAC_SHA256(secret, raw_body)
        if (firma_esperada != request.headers["X-Signature-256"]) descartar()
        ```

        Si las firmas no coinciden, el request no viene de RunFood — descártalo sin procesarlo.
      tags: [Webhook Events]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
            example:
              event: "ORDER.CREATED"
              timestamp: "2026-03-31T15:30:00.000Z"
              schema_version: "2025-02-12"
              data:
                id: 1042
                external_id: "order-12345"
                status: "open"
                total: 13.77
                items:
                  - sku: "PROD-001"
                    name: "Hamburguesa Clásica"
                    quantity: 2
                    unit_price: 5.99
              metadata:
                usuario:
                  id: 5
                  nombre: "María"
                dispositivo:
                  id: "tablet-01"
                  nombre: "Caja Principal"
      responses:
        "200":
          description: Tu servidor debe responder con un código 2xx para confirmar que recibiste el evento. Si respondes con error o no respondes, RunFood lo registra como fallo.
